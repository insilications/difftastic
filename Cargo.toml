[package]
name = "difftastic"
description = "A structural diff that understands syntax."
repository = "https://github.com/wilfred/difftastic"
homepage = "http://difftastic.wilfred.me.uk/"
license = "MIT"
version = "0.64.0"
authors = ["Wilfred Hughes <me@wilfred.me.uk>"]
keywords = ["diff", "syntax"]
categories = [
        "development-tools",
        "command-line-utilities",
        "parser-implementations",
]
edition = "2021"
# Goal: support at least 12 months of Rust versions, and be
# conservative about upgrades to help packagers.
#
# For reference, Debian stable is on 1.63 (see
# https://tracker.debian.org/pkg/rustc) but Debian doesn't currently
# package difftastic. Other distros are somewhat newer.
rust-version = "1.87.0"
include = [
        "/build.rs",
        "/src/",
        "/vendored_parsers/highlights/*.scm",
        "/vendored_parsers/*-src/**/*.c",
        "/vendored_parsers/*-src/**/*.h",
        "/vendored_parsers/*-src/**/*.cc",
        "/LICENSE",
        "/README.md",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/difft-{ target }.{ archive-format }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
regex = "1.10.4"
clap = { version = "4.5.37", features = [
        "cargo",
        "env",
        "wrap_help",
        "string",
] }
typed-arena = "2.0.2"
rustc-hash = "2.0.0"
strsim = "0.10.0"
lazy_static = "1.4.0"
libc = "0.2.108"
log = "0.4.27"
pretty_env_logger = "0.5.0"

mimalloc = { version = "0.1.28", default-features = false }
# Pin libmimalloc-sys due to 0.1.25 producing a huge slowdown in very
# large textual files, as discussed in #297.
libmimalloc-sys = "=0.1.24"
radix-heap = "0.4.2"
# ignore does not declare a MSRV, but it's part of ripgrep, which has
# a slightly more aggressive MSRV than difftastic. Constrain ignore to
# a known-good max version.
ignore = ">= 0.4, < 0.4.24"
owo-colors = "3.5.0"
wu-diff = "0.1.2"
rayon = "1.7.0"
tree_magic_mini = "3.1.5"

bumpalo = "3.16.0"
unicode-width = "0.1.9"
crossterm = { version = "0.28.0", features = ["windows"] }
glob = "0.3.1"
strum = { version = "0.26", features = ["derive"] }
hashbrown = "0.14.0"
humansize = "2.1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
line-numbers = "0.3.0"
smallvec = "1.13.2"
streaming-iterator = "0.1.9"
encoding_rs = "0.8.35"

# tree-sitter itself.
tree-sitter = "0.24.0"
tree-sitter-language = "0.1.3"

# tree-sitter parsers that are available on crates.io.
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.23.4"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23.1"
tree-sitter-elixir = "0.3.4"
tree-sitter-erlang = "0.13.0"
tree-sitter-fsharp = "0.1.0"
tree-sitter-go = "0.23.4"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.4"
tree-sitter-javascript = "0.23.1"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-lua = "0.2.0"
tree-sitter-make = "1.1.1"
tree-sitter-nix = "0.0.2"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.23.2"
tree-sitter-pascal = "0.10.0"
tree-sitter-php = "0.23.11"
tree-sitter-python = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.23.2"
tree-sitter-scala = "0.23.3"
tree-sitter-swift = "0.7.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.0"
tokio = { version = "1.44.2", features = [
        "io-std",
        "io-util",
        "macros",
        "process",
        "rt",
        "time",
] }
futures = { version = "0.3.31", default-features = false, features = [
        "async-await",
        "std",
] }
async-lsp = { version = "0.2.2", features = [
        "client-monitor",
        "stdio",
        "omni-trait",
        "tokio",
        "tracing",
], path = "crates/async-lsp/" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
waitpid-any = { version = "0.3" }
rustix = "1.0.5"
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.41"
async-io = "2.4.0"
tower = "0.5.2"
anyhow = "1.0.98"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
git2 = { version = "0.20.1", features = ["vendored-libgit2"] }
phf = { version = "0.11.3", features = ["macros"] }
macro_rules_attribute = "0.2.0"
slab = "0.4.9"

[dev-dependencies]
async-io = "2.4.0"
async-process = "2.3.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.44.2", features = [
        "io-std",
        "io-util",
        "macros",
        "process",
        "rt",
        "time",
] }
tokio-util = { version = "0.7.15", features = ["compat"] }
tower = "0.5.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
# assert_cmd 2.0.10 requires predicates 3.
# TODO: update.
assert_cmd = ">= 2, < 2.0.9"
predicates = "2.1.0"

pretty_assertions = "1.3.0"

[build-dependencies]
# TODO: enable parallel mode once MSRV hits 1.61, see discussion in
# https://github.com/rust-lang/cc-rs/pull/849
cc = "1.1.30"
rayon = "1.7.0"
version_check = "0.9.4"

[profile.release]
lto = "thin"

[[bin]]
name = "difft"
path = "src/main.rs"

[features]

[lints.clippy]
pedantic = "warn"
cargo = "warn"
nursery = "warn"
too_many_lines = { level = "allow", priority = 1 }

[profile.dev]
opt-level = 0 # controls the `--opt-level` the compiler builds with.
# 0-1 is good for debugging. 2 is well-optimized. Max is 3.
# 's' attempts to reduce size, 'z' reduces size even more.
debug = 2 # (u32 or bool) Include debug information (debug symbols).
# Equivalent to `-C debuginfo=2` compiler flag.
debug-assertions = true # controls whether debug assertions are enabled
# (e.g. debug_assert!() and arithmetic overflow checks)
rpath = false # controls whether compiler should set loader paths.
# If true, passes `-C rpath` flag to the compiler.
lto = false # Link Time Optimization usually reduces size of binaries
# and static libraries. Increases compilation time.
# If true, passes `-C lto` flag to the compiler, and if a
# string is specified like 'thin' then `-C lto=thin` will
# be passed.
codegen-units = 8 # if > 1 enables parallel code generation which improves
# compile times, but prevents some optimizations.
# Passes `-C codegen-units`.
panic = 'unwind'       # panic strategy (`-C panic=...`), can also be 'abort'
incremental = false    # whether or not incremental compilation is enabled
overflow-checks = true # use overflow checks for integer arithmetic.
# Passes the `-C overflow-checks=...` flag to the compiler.
