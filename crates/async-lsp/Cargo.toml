[package]
name = "async-lsp"
version = "0.2.2"
edition = "2021"
description = "Asynchronous Language Server Protocol (LSP) framework based on tower"
keywords = ["lsp", "language-server", "tower"]
categories = ["asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxalica/async-lsp"
# Required features:
# - std::future::poll_fn
# - std::task::ready!
rust-version = "1.64" # Sync with CI!
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/benches",
    "/examples",
    "/src",
    "/tests",
]

[features]
default = ["client-monitor", "omni-trait", "stdio", "tracing"]
client-monitor = ["dep:waitpid-any", "dep:rustix"]
omni-trait = []
stdio = ["dep:rustix", "rustix?/fs", "tokio?/net"]
tracing = ["dep:tracing"]
forward = []

[[example]]
name = "client_builder"
required-features = ["omni-trait", "tracing", "tokio"]

[[example]]
name = "client_trait"
required-features = ["omni-trait", "tracing", "tokio"]

[[example]]
name = "server_builder"
required-features = [
    "client-monitor",
    "omni-trait",
    "stdio",
    "tracing",
    "tokio",
]

[[example]]
name = "server_trait"
required-features = [
    "client-monitor",
    "omni-trait",
    "stdio",
    "tracing",
    "tokio",
]

[[example]]
name = "inspector"
required-features = ["forward", "tracing", "tokio"]

[[test]]
name = "unit_test"
required-features = ["omni-trait", "tokio"]

[[test]]
name = "stdio"
harness = false
required-features = ["stdio", "tokio"]

[[bench]]
name = "bench"
harness = false

[dependencies]
async-io = { workspace = true, optional = true }
futures.workspace = true
lsp-types.workspace = true
pin-project-lite = "0.2.16"
rustix = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing = { version = "0.1.41", optional = true }
waitpid-any = { workspace = true, optional = true }
tracing-subscriber .workspace = true


[dev-dependencies]
async-io = { version = "2.4.0" }
async-process = "2.3.0"
# Workaround: https://github.com/bheisler/criterion.rs/issues/702
clap = { version = "4.5.37", features = [
    "cargo",
    "env",
    "wrap_help",
    "string",
] }
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.44.2", features = [
    "full",
    "tracing",
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }
tokio-util = { version = "0.7.15", features = ["compat"] }
tower = "0.5.2"
tracing-subscriber = { version = "0.3.19", features = [
    "fmt",
    "chrono",
    "local-time",
] }

[profile.bench]
debug = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
